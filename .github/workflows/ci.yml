name: AI Voom CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test
  python-agent-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve and verify committed Python pins
        working-directory: services/agent-python
        run: |
          python -m pip install pip-tools==7.7.0
          pip-compile --resolver=backtracking --output-file=/tmp/requirements.generated.lock requirements.txt
          pip-compile --resolver=backtracking --generate-hashes --output-file=/tmp/requirements.generated-hashed.lock requirements.txt
          python - <<'PY'
          import re
          from pathlib import Path
          def package_pins(path):
              pins = []
              for line in Path(path).read_text().splitlines():
                  if not line or line.startswith("#") or line.startswith(" "):
                      continue
                  match = re.match(r"^([A-Za-z0-9_.-]+(?:\[[^]]+\])?==[^\s;]+)", line)
                  if match:
                      pins.append(match.group(1).lower())
              return sorted(pins)
          committed = package_pins("requirements.lock")
          generated = package_pins("/tmp/requirements.generated.lock")
          if committed != generated:
              print("Committed dependency pins are stale.")
              print("Missing or changed:", sorted(set(generated) - set(committed)))
              print("Unexpected:", sorted(set(committed) - set(generated)))
              raise SystemExit(1)
          PY
      - name: Install hash-locked dependencies
        working-directory: services/agent-python
        run: python -m pip install --require-hashes -r /tmp/requirements.generated-hashed.lock
      - name: Compile and test Python service
        working-directory: services/agent-python
        env:
          VOOM_AGENT_API_TOKEN: ci-test-token-ci-test-token-ci-test-token-123456
        run: |
          python -m compileall -q app
          python -m unittest discover -s tests -v
          python -c "from app.main import app; assert app"
      - name: Audit Python dependencies
        working-directory: services/agent-python
        run: |
          python -m pip install pip-audit
          pip-audit -r /tmp/requirements.generated-hashed.lock
